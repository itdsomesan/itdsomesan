title = "itdsomesan gitleaks config"
[extend]
useDefault = true

[[rules]]
id = "twilio-sid"
description = "Twilio Account SID"
regex = '''AC[a-f0-9]{32}'''
[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\d{8,10}:[A-Za-z0-9_-]{35}'''
[[rules]]
id = "voiceflow-api-key"
description = "Voiceflow API key"
regex = '''VF\.[A-Za-z0-9._-]{20,}'''
[[rules]]
id = "baserow-or-generic-token"
description = "Generic token assignment"
regex = '''(?i)(token|secret|api[_-]?key|password)\s*[:=]\s*['"]?[A-Za-z0-9_\-\.]{16,}'''
